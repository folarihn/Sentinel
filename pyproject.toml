[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-os"
version = "0.2.2"
description = "The control plane for autonomous AI agents"
requires-python = ">=3.11"
authors = [{name = "folarihn"}]
dependencies = []
license = "MIT AND OFL-1.1"
license-files = ["LICENSE", "sentinel/web/fonts/*-OFL.txt"]

[project.scripts]
sentinel = "sentinel.server:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.setuptools.package-data]
sentinel = ["web/*", "web/fonts/*.ttf", "web/fonts/*-OFL.txt"]
