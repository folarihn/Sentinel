name: sentinel
version: "0.2.1"
description: Local runtime policy enforcement, observability and recovery for Hermes
author: folarihn
requires_hermes: ">=0.20.0"
provides_tools:
  - sentinel_preflight
  - sentinel_scope
  - sentinel_checkpoint
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - on_session_start
  - on_session_end
  - subagent_start
  - subagent_stop
  - pre_approval_request
  - post_approval_response
