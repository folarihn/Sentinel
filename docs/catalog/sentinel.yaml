# Prepared catalog candidate for 0.2.1. Not yet submitted or admitted.
name: sentinel
title: SENTINEL OS
repo: https://github.com/folarihn/Sentinel
sha: 7ab2ae78b396b2d8cd163fde143656261d46b722
version: "0.2.1"
description: "Local runtime policy, redacted execution history, supported-file recovery, agent preflight tools and a runaway breaker, with Telegram-ready /sentinel commands. Trusted hooks, not an OS sandbox; native approval modes apply and backups retain original bytes."
maintainer: folarihn
tier: community
category: tools
requires_hermes: ">=0.20.0"
platforms:
  - windows
  - linux
readme: true
screenshots:
  - https://raw.githubusercontent.com/folarihn/Sentinel/7ab2ae78b396b2d8cd163fde143656261d46b722/docs/images/overview-desktop.jpg
  - https://raw.githubusercontent.com/folarihn/Sentinel/7ab2ae78b396b2d8cd163fde143656261d46b722/docs/images/guard-desktop.jpg
  - https://raw.githubusercontent.com/folarihn/Sentinel/7ab2ae78b396b2d8cd163fde143656261d46b722/docs/images/guard-mobile.jpg
known_issues: "Actual owner once approvals and model adversarial attempts verified; actual owner denial verified through native callbacks; /sentinel commands, agent tools and breaker verified in disposable Windows and Linux profiles; delivery of /sentinel replies and alerts inside the Telegram app not yet verified end to end. Native approval modes apply. Directory-scoped shell coverage is conservative; recovery is limited to supported local files."
capabilities:
  provides_tools:
    - sentinel_preflight
    - sentinel_scope
    - sentinel_checkpoint
  provides_middleware: []
  requires_env: []
  provides_hooks:
    - pre_tool_call
    - post_tool_call
    - on_session_start
    - on_session_end
    - subagent_start
    - subagent_stop
    - pre_approval_request
    - post_approval_response
