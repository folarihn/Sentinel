name: Sentinel checks
on: [push, pull_request]
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . ruff
      - run: python -m unittest discover -v
      - run: python -m compileall -q sentinel
      - run: ruff check --select E9,F63,F7,F82 sentinel tests
      - run: ruff format --check sentinel tests scripts __init__.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check sentinel/web/app.js
